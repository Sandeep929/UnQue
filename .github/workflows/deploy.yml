name: Deploy Unque

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

# One deployment per branch at a time, never cancel a running deploy
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write   # needed for AWS OIDC
  contents: read

env:
  # =====================================
  # AWS / ECR
  # =====================================
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "044408705679"
  ECR_REPOSITORY: unque
  CONTAINER_PORT: "3000"

  # =====================================
  # DEVELOPMENT
  # =====================================
  DEV_EC2_INSTANCE: i-00f7e3aa5f99487bb
  DEV_SSM_PATH: /unque/dev
  DEV_NGINX_UPSTREAM: /etc/nginx/conf.d/unque-dev-upstream.conf
  DEV_UPSTREAM_NAME: unque_dev_backend
  DEV_BLUE_PORT: "3001"
  DEV_GREEN_PORT: "3002"
  DEV_BLUE_CONTAINER: unque-backend-dev-blue
  DEV_GREEN_CONTAINER: unque-backend-dev-green

  # =====================================
  # PRODUCTION
  # =====================================
  PROD_EC2_INSTANCE: i-00f7e3aa5f99487bb
  PROD_SSM_PATH: /unque/prod
  PROD_NGINX_UPSTREAM: /etc/nginx/conf.d/unque-prod-upstream.conf
  PROD_UPSTREAM_NAME: unque_prod_backend
  PROD_BLUE_PORT: "3003"
  PROD_GREEN_PORT: "3004"
  PROD_BLUE_CONTAINER: unque-backend-prod-blue
  PROD_GREEN_CONTAINER: unque-backend-prod-green

jobs:
  deploy:
    name: Build & Blue-Green Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 5. PRODUCTION APPROVAL
    # Configure "Required reviewers" on the `prod` environment in
    # Repo > Settings > Environments. The job pauses here until approved.
    # `dev` has no rules, so it runs immediately.
    environment: ${{ github.ref_name }}

    steps:
      # =====================================
      # 1. VALIDATE BRANCH
      # =====================================
      - name: Validate Branch & Resolve Config
        run: |
          set -e
          case "${GITHUB_REF_NAME}" in
            dev)  P=DEV  ;;
            prod) P=PROD ;;
            *) echo "::error::Unsupported branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

          get() { local n="${P}_$1"; echo "${!n}"; }

          {
            echo "DEPLOY_ENV=${GITHUB_REF_NAME}"
            echo "EC2_INSTANCE=$(get EC2_INSTANCE)"
            echo "SSM_PATH=$(get SSM_PATH)"
            echo "NGINX_UPSTREAM=$(get NGINX_UPSTREAM)"
            echo "UPSTREAM_NAME=$(get UPSTREAM_NAME)"
            echo "BLUE_PORT=$(get BLUE_PORT)"
            echo "GREEN_PORT=$(get GREEN_PORT)"
            echo "BLUE_CONTAINER=$(get BLUE_CONTAINER)"
            echo "GREEN_CONTAINER=$(get GREEN_CONTAINER)"
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          } >> "$GITHUB_ENV"

          echo "Branch: ${GITHUB_REF_NAME} | Image tag: ${GITHUB_SHA}"

      # =====================================
      # 2. VERIFY AWS IAM
      # =====================================
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d.get(k) for k in ("iss","aud","sub","repository")})' "$TOKEN"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      # =====================================
      # 3. CHECKOUT
      # =====================================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================================
      # 4. TESTS (disabled, same as Jenkins)
      # =====================================
      # - name: Test
      #   run: |
      #     npm ci
      #     npm run test --if-present

      # =====================================
      # 6. BUILD AND PUSH IMAGE (replaces CodeBuild)
      # =====================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}
          build-args: |
            ENVIRONMENT=${{ env.DEPLOY_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =====================================
      # 7. BLUE-GREEN DEPLOYMENT (via SSM, unchanged logic)
      # =====================================
      - name: Build remote deployment script
        run: |
          set -e

          # Config header: values are resolved here on the runner
          {
            echo "#!/bin/bash"
            echo "set -Eeuo pipefail"
            echo "export AWS_REGION='${AWS_REGION}'"
            echo "ECR_REGISTRY='${ECR_REGISTRY}'"
            echo "IMAGE='${ECR_URI}:${IMAGE_TAG}'"
            echo "ENVIRONMENT='${DEPLOY_ENV}'"
            echo "SSM_PATH='${SSM_PATH}'"
            echo "BLUE_PORT='${BLUE_PORT}'"
            echo "GREEN_PORT='${GREEN_PORT}'"
            echo "BLUE_CONTAINER='${BLUE_CONTAINER}'"
            echo "GREEN_CONTAINER='${GREEN_CONTAINER}'"
            echo "NGINX_UPSTREAM='${NGINX_UPSTREAM}'"
            echo "UPSTREAM_NAME='${UPSTREAM_NAME}'"
            echo "CONTAINER_PORT='${CONTAINER_PORT}'"
          } > remote.sh

          # Body: quoted heredoc, so nothing is expanded on the runner
          cat >> remote.sh <<'REMOTE_SCRIPT'

          echo "======================================"
          echo "STARTING BLUE-GREEN DEPLOYMENT"
          echo "Environment: ${ENVIRONMENT}"
          echo "======================================"

          STATE_DIR="/opt/unque/${ENVIRONMENT}"
          STATE_FILE="${STATE_DIR}/active-slot"
          ENV_FILE="${STATE_DIR}/.env"
          mkdir -p "${STATE_DIR}"

          # 1. ECR AUTHENTICATION
          echo "Authenticating with ECR..."
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          # 2. RETRIEVE ENVIRONMENT VARIABLES FROM SSM
          echo "Retrieving parameters from SSM..."
          aws ssm get-parameters-by-path \
            --path "${SSM_PATH}" \
            --recursive \
            --with-decryption \
            --region "${AWS_REGION}" \
            --output json > /tmp/unque-parameters.json

          ENV_FILE="${ENV_FILE}" python3 - <<'PY'
          import json, os, re

          with open("/tmp/unque-parameters.json") as f:
              data = json.load(f)

          parameters = data.get("Parameters", [])
          if not parameters:
              raise SystemExit("ERROR: No SSM parameters found")

          with open(os.environ["ENV_FILE"], "w") as f:
              for p in parameters:
                  key = p["Name"].split("/")[-1]
                  value = p["Value"]

                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      raise SystemExit("Invalid environment variable name")

                  if "\n" in value or "\r" in value:
                      raise SystemExit("Multiline environment values are unsupported")

                  f.write(f"{key}={value}\n")
          PY

          chmod 600 "${ENV_FILE}"
          rm -f /tmp/unque-parameters.json

          # 3. IDENTIFY ACTIVE SLOT
          if [ -f "${STATE_FILE}" ]; then
            ACTIVE_SLOT=$(cat "${STATE_FILE}")
          else
            ACTIVE_SLOT="none"
          fi
          echo "Current active slot: ${ACTIVE_SLOT}"

          if [ "${ACTIVE_SLOT}" = "blue" ]; then
            TARGET_SLOT="green"; TARGET_PORT="${GREEN_PORT}"; TARGET_CONTAINER="${GREEN_CONTAINER}"
          else
            TARGET_SLOT="blue";  TARGET_PORT="${BLUE_PORT}";  TARGET_CONTAINER="${BLUE_CONTAINER}"
          fi
          echo "Target slot: ${TARGET_SLOT}"
          echo "Target container: ${TARGET_CONTAINER}"

          # 4. PULL NEW IMAGE
          echo "Pulling new Docker image..."
          docker pull "${IMAGE}"

          # 5. REMOVE ONLY INACTIVE CONTAINER
          echo "Removing old inactive container if present..."
          docker rm -f "${TARGET_CONTAINER}" 2>/dev/null || true

          # 6. START NEW CONTAINER
          echo "Starting new container..."
          docker run -d \
            --name "${TARGET_CONTAINER}" \
            --restart unless-stopped \
            --env-file "${ENV_FILE}" \
            -p "127.0.0.1:${TARGET_PORT}:${CONTAINER_PORT}" \
            "${IMAGE}"

          # 7. HEALTH CHECK
          echo "Waiting for application health..."
          HEALTHY=false
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${TARGET_CONTAINER}" 2>/dev/null || echo "missing")
            echo "Docker health: ${STATUS}"
            if [ "${STATUS}" = "healthy" ]; then HEALTHY=true; break; fi
            if [ "${STATUS}" = "unhealthy" ]; then break; fi
            sleep 5
          done

          if [ "${HEALTHY}" != "true" ]; then
            echo "New container failed health verification!"
            docker logs "${TARGET_CONTAINER}" || true
            docker rm -f "${TARGET_CONTAINER}" || true
            exit 1
          fi

          if ! curl -fsS "http://127.0.0.1:${TARGET_PORT}/health" >/dev/null; then
            echo "HTTP health check failed!"
            docker logs "${TARGET_CONTAINER}" || true
            docker rm -f "${TARGET_CONTAINER}" || true
            exit 1
          fi
          echo "New container is healthy!"

          # 8. PREPARE NGINX CONFIGURATION
          echo "Preparing Nginx traffic switch..."
          mkdir -p "$(dirname "${NGINX_UPSTREAM}")"
          BACKUP_FILE="${NGINX_UPSTREAM}.backup"
          TEMP_FILE="${NGINX_UPSTREAM}.tmp"

          if [ -f "${NGINX_UPSTREAM}" ]; then
            cp "${NGINX_UPSTREAM}" "${BACKUP_FILE}"
          else
            rm -f "${BACKUP_FILE}"
          fi

          cat > "${TEMP_FILE}" <<NGINX_EOF
          upstream ${UPSTREAM_NAME} {
              server 127.0.0.1:${TARGET_PORT};
          }
          NGINX_EOF
          mv "${TEMP_FILE}" "${NGINX_UPSTREAM}"

          rollback_nginx() {
            if [ -f "${BACKUP_FILE}" ]; then
              mv "${BACKUP_FILE}" "${NGINX_UPSTREAM}"
            else
              rm -f "${NGINX_UPSTREAM}"
            fi
          }

          # 9. VALIDATE NGINX
          if ! nginx -t; then
            echo "Nginx configuration validation failed!"
            rollback_nginx
            docker rm -f "${TARGET_CONTAINER}" || true
            exit 1
          fi

          # 10. SWITCH TRAFFIC
          echo "Switching Nginx traffic..."
          if ! systemctl reload nginx; then
            echo "Nginx reload failed. Restoring previous configuration..."
            rollback_nginx
            nginx -t && systemctl reload nginx || true
            docker rm -f "${TARGET_CONTAINER}" || true
            exit 1
          fi

          # 11. VERIFY AFTER SWITCH
          if ! curl -fsS "http://127.0.0.1:${TARGET_PORT}/health" >/dev/null; then
            echo "Post-deployment verification failed!"
            rollback_nginx
            nginx -t && systemctl reload nginx || true
            docker rm -f "${TARGET_CONTAINER}" || true
            exit 1
          fi

          # 12. UPDATE ACTIVE SLOT
          echo "${TARGET_SLOT}" > "${STATE_FILE}"
          rm -f "${BACKUP_FILE}"

          echo "======================================"
          echo "BLUE-GREEN DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Environment: ${ENVIRONMENT}"
          echo "Active slot: ${TARGET_SLOT}"
          echo "Container: ${TARGET_CONTAINER}"
          echo "Port: ${TARGET_PORT}"
          echo "Image: ${IMAGE}"
          echo "Previous container retained for rollback."
          REMOTE_SCRIPT

          # The heredoc body is indented by YAML; strip that leading indentation
          sed -i 's/^          //' remote.sh

      - name: Run deployment on EC2 via SSM
        run: |
          set -e

          ENCODED=$(base64 -w0 remote.sh)

          python3 -c 'import json,sys; print(json.dumps({"commands":["echo " + sys.argv[1] + " | base64 -d | sudo bash"]}))' \
            "$ENCODED" > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE}" \
            --document-name AWS-RunShellScript \
            --comment "Blue-Green deployment: ${DEPLOY_ENV} (${GITHUB_SHA::7})" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          # Poll manually: `aws ssm wait command-executed` gives up after ~100s
          STATUS="Pending"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM status: ${STATUS}"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "----- REMOTE STDOUT -----"
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE}" \
            --query 'StandardOutputContent' --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "----- REMOTE STDERR -----"
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE}" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::Deployment failed. Previous active container should remain available."
            exit 1
          fi

          rm -f ssm-parameters.json remote.sh

      # =====================================
      # 8. DEPLOYMENT SUMMARY
      # =====================================
      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Blue-Green Deployment Successful"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Environment | \`${DEPLOY_ENV}\` |"
            echo "| Image | \`${ECR_URI}:${IMAGE_TAG}\` |"
            echo "| EC2 Instance | \`${EC2_INSTANCE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure note
        if: failure()
        run: echo "Pipeline failed. Previous active container should remain available."